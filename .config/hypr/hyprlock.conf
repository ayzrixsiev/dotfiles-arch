source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
}

#######################
# BACKGROUND
#######################
background {
    monitor =
    path = ~/.config/omarchy/current/background
    color = rgba(0, 0, 0, 0.6)

    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.2
}

#######################
# ANIMATIONS
#######################
animations {
    enabled = true
    animation = fade, 1, 3, default
    animation = input, 1, 4, easeOutExpo
}

#######################
# INPUT FIELD (PASSWORD BOX)
#######################
input-field {
    monitor =
    size = 520, 80
    position = 0, -40
    halign = center
    valign = center

    rounding = 14
    outline_thickness = 3
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)

    inner_color = rgba(20, 20, 20, 0.75)
    outer_color = rgba(120, 120, 120, 0.4)
    check_color = rgba(80, 200, 120, 1.0)
    fail_color = rgba(220, 80, 80, 1.0)

    font_family = JetBrainsMono Nerd Font
    font_size = 22
    font_color = rgba(235, 235, 235, 1.0)

    placeholder_text = <i>Enter your password</i>
    hide_input = false
    fade_on_empty = true

    fail_text = <span foreground="#ff5555">Authentication Failed</span>
}

#######################
# CLOCK (TOP CENTER)
#######################
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgba(240, 240, 240, 0.9)

    position = 0, 180
    halign = center
    valign = center
}

#######################
# DATE (UNDER CLOCK)
#######################
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = JetBrainsMono Nerd Font
    font_size = 22
    color = rgba(200, 200, 200, 0.8)

    position = 0, 115
    halign = center
    valign = center
}

#######################
# USER / SYSTEM LABEL
#######################
label {
    monitor =
    text = Welcome back
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(180, 180, 180, 0.7)

    position = 0, -120
    halign = center
    valign = center
}

#######################
# AUTH
#######################
auth {
    fingerprint:enabled = false
}

